worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream website {
        server website:5000;
    }

    upstream chat {
        server chat:5001;
    }

    server {
        listen       80;
        server_name  localhost;

        location / {
            proxy_pass http://website;  # Имя сервиса Website
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
    	    proxy_pass http://chat;
    	    proxy_http_version 1.1;  # Необходимо для WebSocket
    	    proxy_set_header Upgrade $http_upgrade;  # Обработка Upgrade запроса
    	    proxy_set_header Connection "upgrade";  # Установка правильного заголовка Connection

    	}
        location /chat/ {
            proxy_pass http://chat;  # Имя сервиса Website
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
 
    }
}
