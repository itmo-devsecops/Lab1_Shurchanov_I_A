services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: 2004
      POSTGRES_DB: web
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - website
      - chat

  website:
    build: ./Website
    container_name: website
    depends_on:
      - db


  chat:
    build: ./Chat
    container_name: chat
    depends_on:
      - db
    ports:
      - "5001:5001"
